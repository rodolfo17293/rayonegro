  /* ----- LIQUID GLASS ----- */
  .liquid-glass {
    position: relative;
    background: rgba(255, 255, 255, 0.03);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
    isolation: isolate;
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.35) 0%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.35) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ----- ANIMATIONS ----- */
  @keyframes fade-rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-rise        { animation: fade-rise 0.9s ease-out both; }
  .animate-fade-rise-delay  { animation: fade-rise 0.9s ease-out 0.2s both; }
  .animate-fade-rise-delay-2{ animation: fade-rise 0.9s ease-out 0.4s both; }

  @media (prefers-reduced-motion: reduce) {
    .animate-fade-rise,
    .animate-fade-rise-delay,
    .animate-fade-rise-delay-2 { animation: none; }
  }

  /* ----- GRAIN ----- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    opacity: 0.03;

</style>
